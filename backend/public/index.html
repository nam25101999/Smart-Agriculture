<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Agriculture API Gateway</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F0F4F1;
      color: #1B3B1B;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 36px 48px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 480px;
    }
    h1 {
      color: #2E7D32;
      margin-bottom: 8px;
      font-size: 24px;
    }
    p {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #E8F5E9;
      color: #2E7D32;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      margin: 10px 0;
      padding: 12px 20px;
      background: #2E7D32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1B5E20;
    }
    .btn-secondary {
      background: #E3F2FD;
      color: #1565C0;
    }
    .btn-secondary:hover {
      background: #BBDEFB;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Online - Vercel Serverless</div>
    <h1>🌱 Smart Agriculture API</h1>
    <p>Máy chủ Backend API Nông Nghiệp Thông Minh đang hoạt động bình thường trên nền tảng đám mây.</p>
    <a href="/health" class="btn">Kiểm tra Trạng thái (/health)</a>
    <a href="/api-docs" class="btn btn-secondary">Xem Tài liệu Swagger API (/api-docs)</a>
  </div>
</body>
</html>
