# =================================================================
# SMART AGRICULTURE - MQTT TOPIC ACCESS CONTROL LIST (ACL)
# Tiêu chí: Bảo mật và Phân quyền Topic (Lab 2 - Điểm tối đa 0.4đ)
# =================================================================

# 1. Phân quyền cho Thiết bị Phần cứng (ESP32)
# ESP32 chỉ được phép Publish telemetry, status, ack và Subscribe lệnh điều khiển
user esp32_device
topic write smartagri/devices/+/telemetry
topic write smartagri/devices/+/status
topic write smartagri/devices/+/ack
topic read smartagri/devices/+/commands

# 2. Phân quyền cho Hệ thống Máy chủ Backend
# Backend có quyền Publish lệnh điều khiển và Subscribe mọi topic telemetry, ack, status
user backend_server
topic readwrite smartagri/#

# 3. Phân quyền cho Quản trị viên (Admin)
# Quản trị viên có toàn quyền truy cập tất cả topic bao gồm cả thông số hệ thống $SYS
user admin
topic readwrite #
topic read $SYS/#

