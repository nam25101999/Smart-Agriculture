# =================================================================
# SMART AGRICULTURE - ECLIPSE MOSQUITTO CONFIGURATION (LAB 2)
# =================================================================

# 1. Cấu hình cổng kết nối (Listeners)
# Listener mặc định cho kết nối MQTT chuẩn (TCP)
listener 1883
protocol mqtt

# Listener cho kết nối qua WebSocket (cho Web client hoặc ứng dụng)
listener 9001
protocol websockets

# 2. Cấu hình lưu trữ trạng thái (Persistence)
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# 3. Cấu hình ghi nhật ký (Logging)
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# 4. Bảo mật & Xác thực (Security & Authentication)
# Không cho phép client kết nối ẩn danh (bắt buộc phải có user/pass)
allow_anonymous false

# Tệp chứa tài khoản và mật khẩu đã mã hóa (mosquitto_passwd)
password_file /mosquitto/config/password_file

# Tệp danh sách điều khiển truy cập phân quyền Topic (ACL)
acl_file /mosquitto/config/acl.conf

# 5. Giới hạn tài nguyên & Hiệu năng
max_queued_messages 10000
max_connections -1
keepalive_interval 60

